  <style>
    *, *::before, *::after { font-family: 'Tajawal', sans-serif; box-sizing: border-box; }
    body { background: #eef2ff; margin: 0; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #e0e7ff; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }

    /* ── Glassmorphism ── */
    .glass {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.5);
    }
    .glass-dark {
      background: rgba(13,27,62,0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* ── Animations ── */
    @keyframes spin     { to{transform:rotate(360deg)} }
    @keyframes fadeUp   { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn   { from{opacity:0} to{opacity:1} }
    @keyframes shake    { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    @keyframes pulse-ring { 0%{box-shadow:0 0 0 0 rgba(59,130,246,.5)} 70%{box-shadow:0 0 0 10px rgba(59,130,246,0)} 100%{box-shadow:0 0 0 0 rgba(59,130,246,0)} }
    @keyframes shimmer  { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    @keyframes barFill  { from{width:0} to{width:var(--w)} }

    .fade-up   { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) both; }
    .fade-in   { animation: fadeIn .3s ease both; }
    .shake-it  { animation: shake .4s ease; }

    /* ── Cards ── */
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 20px rgba(59,130,246,.07);
      transition: transform .25s, box-shadow .25s;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(59,130,246,.14); }

    /* ── Gradient text ── */
    .grad-text {
      background: linear-gradient(135deg,#3b82f6,#06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Grade bar ── */
    .bar-fill { transition: width .7s cubic-bezier(.4,0,.2,1); }

    /* ── Badge medals ── */
    .medal-1 { background: linear-gradient(135deg,#fbbf24,#f59e0b); box-shadow: 0 4px 14px rgba(245,158,11,.4); }
    .medal-2 { background: linear-gradient(135deg,#94a3b8,#64748b); box-shadow: 0 4px 14px rgba(100,116,139,.4); }
    .medal-3 { background: linear-gradient(135deg,#c97c50,#a0522d); box-shadow: 0 4px 14px rgba(160,82,45,.4); }

    /* ── Nav tabs ── */
    .nav-tab { transition: all .2s; }
    .nav-tab.active { background: linear-gradient(135deg,#1d4ed8,#06b6d4); color: #fff; box-shadow: 0 4px 14px rgba(29,78,216,.3); }
    .nav-tab:not(.active):hover { background: rgba(59,130,246,.1); color: #1d4ed8; }

    /* ── Inputs ── */
    .inp {
      width: 100%; border: 2px solid #e0e7ff; border-radius: 14px;
      padding: 10px 16px; font-size: 14px; color: #0d1b3e;
      transition: border .2s, box-shadow .2s; outline: none; background: #fff;
    }
    .inp:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,.12); }

    /* ── Modal overlay ── */
    .modal-bg { background: rgba(13,27,62,.6); backdrop-filter: blur(6px); position:fixed; inset:0; width:100%; height:100vh; overflow-y:auto; display:flex; align-items:flex-start; justify-content:center; padding:16px; box-sizing:border-box; }

    /* ── Admin bar ── */
    .admin-bar { background: linear-gradient(90deg,#0d1b3e 0%,#1d4ed8 60%,#06b6d4 100%); }

    /* ── Chip ── */
    .chip { display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }

    /* ── Hero bg ── */
    .hero-bg {
      background: linear-gradient(135deg, #0d1b3e 0%, #1e3a8a 45%, #1d4ed8 75%, #06b6d4 100%);
    }

    /* ── CIS Logo CSS ── */
    .cis-logo-wrap { display:flex; align-items:center; gap:10px; }
    .cis-badge {
      background: #c8102e;
      border-radius: 10px;
      padding: 4px 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .cis-badge span { color:#fff; font-weight:900; font-size:18px; letter-spacing:.08em; }
    .cis-flag { display:flex; height:4px; border-radius:2px; overflow:hidden; margin-top:3px; }
    .cis-flag .r { background:#c8102e; flex:1; }
    .cis-flag .w { background:#fff; flex:1; }
    .cis-flag .g { background:#008000; flex:1; }

    /* ── Type pill ── */
    .pill-ind { background:#eff6ff; color:#1d4ed8; border:1.5px solid #bfdbfe; }
    .pill-grp { background:#ecfdf5; color:#065f46; border:1.5px solid #a7f3d0; }

    input[type=number]::-webkit-inner-spin-button { opacity:.4; }

    /* ── Sticky sidebar ── */
    @media(min-width:1024px){
      .layout-grid { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
      .sidebar { position:sticky; top:0; height:100vh; overflow-y:auto; }
    }

const tot = g => (g.plus||0)+(g.tasks||0)+(g.identity||0);
const rankList = (ss,gs) => [...ss].sort((a,b)=>tot(gs[b.id]||{})-tot(gs[a.id]||{}));
const AV_COLORS = ['#1d4ed8','#0d1b3e','#065f46','#7c3aed','#c8102e','#0891b2'];
function avColor(name){ let h=0; for(let c of name) h=(h+c.charCodeAt(0))%AV_COLORS.length; return AV_COLORS[h]; }

/* ══════════════════════════════════════
   MICRO COMPONENTS
══════════════════════════════════════ */
function Av({name,size=40,ring=false}){
  const ini = name.split(' ').slice(0,2).map(w=>w[0]).join('');
  return (
    <div style={{width:size,height:size,background:avColor(name),fontSize:size*.38,
      boxShadow:ring?`0 0 0 3px #fff, 0 0 0 5px ${avColor(name)}44`:undefined}}
      className="rounded-full flex items-center justify-center text-white font-bold flex-shrink-0 select-none">
      {ini}
    </div>
  );
}

function Chip({label,color='blue',icon}){
  const cls={
    blue:'bg-blue-50 text-blue-700 border border-blue-200',
    green:'bg-emerald-50 text-emerald-700 border border-emerald-200',
    amber:'bg-amber-50 text-amber-700 border border-amber-200',
    purple:'bg-purple-50 text-purple-700 border border-purple-200',
    red:'bg-red-50 text-red-600 border border-red-200',
    gray:'bg-gray-100 text-gray-500 border border-gray-200',
    cyan:'bg-cyan-50 text-cyan-700 border border-cyan-200',
  };
  return <span className={`chip ${cls[color]||cls.blue}`}>{icon&&<span>{icon}</span>}{label}</span>;
}

function Bar({pct,color='blue',h=8}){
  const bg={blue:'linear-gradient(90deg,#1d4ed8,#06b6d4)',green:'linear-gradient(90deg,#059669,#10b981)',amber:'linear-gradient(90deg,#d97706,#fbbf24)',purple:'linear-gradient(90deg,#7c3aed,#a78bfa)'};
  return (
    <div style={{height:h,borderRadius:h}} className="w-full bg-blue-50 overflow-hidden">
      <div className="bar-fill h-full" style={{width:`${Math.min(pct,100)}%`,background:bg[color]||bg.blue,borderRadius:h}}/>
    </div>
  );
}

function Inp({label,value,onChange,placeholder,type='text',icon}){
  return (
    <div>
      {label&&<label className="text-sm font-700 text-brand-800 mb-1.5 block">{label}</label>}
      <div className="relative">
        {icon&&<span className="absolute right-3.5 top-1/2 -translate-y-1/2 text-base">{icon}</span>}
        <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
          className={`inp ${icon?'pr-10':''}`}/>
      </div>
    </div>
  );
}

function GInp({label,sub,value,max,onChange,color='blue'}){
  const pct=Math.round((Number(value)/max)*100);
  return (
    <div>
      <div className="flex justify-between mb-1.5">
        <label className="text-sm font-700 text-brand-800">{label}<span className="text-gray-400 font-400 text-xs mr-1">({sub})</span></label>
        <span className="text-sm font-800 text-brand-700">{value}/{max}</span>
      </div>
      <input type="number" min={0} max={max} value={value}
        onChange={e=>onChange(Math.min(max,Math.max(0,Number(e.target.value))))}
        className="inp mb-2"/>
      <Bar pct={pct} color={color}/>
    </div>
  );
}

function CISLogo({size='md'}){
  const s = size==='lg' ? {badge:52,cisFont:20,name:20,sub:12} : size==='sm' ? {badge:32,cisFont:13,name:13,sub:10} : {badge:40,cisFont:16,name:16,sub:11};
  return (
    <div className="flex items-center gap-2.5">
      {/* Badge */}
      <div style={{width:s.badge,height:s.badge,borderRadius:10,background:'#c8102e',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
        <span style={{color:'#fff',fontWeight:900,fontSize:s.cisFont,letterSpacing:'.05em'}}>CIS</span>
      </div>
      {/* Text */}
      <div>
        <div style={{fontSize:s.name}} className="font-900 text-white leading-tight">College</div>
        <div style={{fontSize:s.sub}} className="font-500 text-blue-200 leading-tight tracking-widest">IRAQ الـعـراق</div>
        {/* Mini flag */}
        <div className="flex mt-0.5 rounded-sm overflow-hidden" style={{height:3,width:48}}>
          <div style={{flex:1,background:'#c8102e'}}/>
          <div style={{flex:1,background:'#fff'}}/>
          <div style={{flex:1,background:'#007a3d'}}/>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   LOGIN MODAL
══════════════════════════════════════ */
function LoginModal({onClose,onLogin}){
  const [u,setU]=useState(''); const [p,setP]=useState('');
  const [show,setShow]=useState(false); const [err,setErr]=useState('');
  const [load,setLoad]=useState(false); const [shk,setShk]=useState(false);

  function go(e){
    e.preventDefault(); setLoad(true);
    setTimeout(()=>{
      if(u.trim()===ADMIN_USER&&p===ADMIN_PASS){ sessionStorage.setItem(SK,'1'); onLogin(); }
      else{ setErr('بيانات الدخول غير صحيحة'); setShk(true); setTimeout(()=>setShk(false),500); }
      setLoad(false);
    },700);
  }
  return (
    <div className="modal-bg z-50 fade-in">
      <div className={`bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden ${shk?'shake-it':''}`}>
        {/* Header */}
        <div className="hero-bg p-8 text-center relative overflow-hidden">
          <div className="absolute inset-0 opacity-10" style={{backgroundImage:'radial-gradient(circle,#fff 1px,transparent 1px)',backgroundSize:'28px 28px'}}/>
          <div className="relative flex justify-center mb-4"><CISLogo size="lg"/></div>
          <p className="text-blue-200 text-sm font-500">لوحة التحكم — للمسؤول فقط</p>
        </div>
        {/* Form */}
        <form onSubmit={go} className="p-7 space-y-4">
          <Inp label="اسم المستخدم" value={u} onChange={v=>{setU(v);setErr('');}} placeholder="أدخل اسم المستخدم" icon="👤"/>
          <div>
            <label className="text-sm font-700 text-brand-800 mb-1.5 block">كلمة المرور</label>
            <div className="relative">
              <span className="absolute right-3.5 top-1/2 -translate-y-1/2">🔒</span>
              <input type={show?'text':'password'} value={p} onChange={e=>{setP(e.target.value);setErr('');}}
                placeholder="أدخل كلمة المرور" className="inp pr-10 pl-10" required/>
              <button type="button" onClick={()=>setShow(x=>!x)}
                className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-600 transition text-base">{show?'🙈':'👁️'}</button>
            </div>
          </div>
          {err&&<div className="bg-red-50 border border-red-200 text-red-600 rounded-xl px-4 py-2.5 text-sm font-600 text-center">⚠️ {err}</div>}
          <button type="submit" disabled={load}
            className="w-full py-3 rounded-xl font-800 text-white text-base transition-all"
            style={{background:load?'#94a3b8':'linear-gradient(135deg,#1d4ed8,#06b6d4)',boxShadow:load?'none':'0 4px 14px rgba(29,78,216,.35)'}}>
            {load?'⏳ جاري التحقق...':'🔐 دخول'}
          </button>
          <button type="button" onClick={onClose}
            className="w-full py-2.5 rounded-xl font-700 text-gray-500 hover:bg-gray-100 transition text-sm">إلغاء</button>
        </form>
      </div>
    </div>
  );
}

function Students(){
  const {students:ss,setStudents,grades:gs,isAdmin}=useContext(Ctx);
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({name:'',phone:'',email:'',bestProject:'',projectLabel:'',completed:false});
  const list=rankList(ss,gs);
  const F=v=>setForm(p=>({...p,...v}));

  function save(){
    if(!form.name.trim())return;
    if(modal==='add') setStudents(p=>[...p,{...form,id:Date.now()}]);
    else setStudents(p=>p.map(s=>s.id===modal.id?{...s,...form}:s));
    setModal(null);
  }

  return (
    <div className="fade-up space-y-5">
      <div className="flex items-center justify-between">
        <h2 className="text-brand-900 text-xl font-800">👥 قائمة الطلاب</h2>
        {isAdmin&&<button onClick={()=>{setForm({name:'',phone:'',email:'',bestProject:'',projectLabel:'',completed:false,showInBestWorks:false});setModal('add');}}
          className="flex items-center gap-2 px-5 py-2.5 rounded-xl font-700 text-white text-sm transition"
          style={{background:'linear-gradient(135deg,#1d4ed8,#06b6d4)',boxShadow:'0 4px 14px rgba(29,78,216,.3)'}}>
          <span className="text-lg">+</span> إضافة طالب
        </button>}
      </div>

      <div className="space-y-3">
        {list.map((s,i)=>{
          const g=gs[s.id]||{}; const t=tot(g); const pct=Math.round(t/5);
          return (
            <div key={s.id} className="card px-6 py-4 flex items-center gap-4">
              <span className="text-gray-300 font-800 w-5 text-center text-sm">{i+1}</span>
              <Av name={s.name} size={48}/>
              <div className="flex-1 min-w-0">
                <div className="font-800 text-brand-900 flex items-center gap-2 flex-wrap">
                  {s.name}
                  {s.completed&&<Chip label="مكتمل" color="green" icon="🎓"/>}
                </div>
                <div className="text-gray-400 text-xs mt-0.5">📱 {s.phone} · ✉️ {s.email}</div>
                <div className="text-blue-500 text-xs mt-0.5 font-500">🎨 {s.bestProject||'—'}</div>
                <div className="mt-2 w-full max-w-48"><Bar pct={pct} h={5}/></div>
              </div>
              <div className="flex gap-1.5 flex-wrap justify-end">
                <Chip label={`+${g.plus||0}`} color="amber" icon="⭐"/>
                <Chip label={`${g.tasks||0}`} color="blue"  icon="📋"/>
                <Chip label={`${g.identity||0}`} color="purple" icon="🎨"/>
              </div>
              <div className="font-900 grad-text text-xl text-left" style={{minWidth:56}}>{t}<span className="text-xs text-gray-400 font-500">/500</span></div>
              {isAdmin&&(
                <div className="flex flex-col gap-1">
                  <button onClick={()=>{setForm({...s});setModal(s);}}
                    className="w-8 h-8 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-600 flex items-center justify-center transition text-sm">✏️</button>
                  <button onClick={()=>confirm('حذف الطالب؟')&&setStudents(p=>p.filter(x=>x.id!==s.id))}
                    className="w-8 h-8 rounded-lg bg-red-50 hover:bg-red-100 text-red-500 flex items-center justify-center transition text-sm">🗑️</button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {modal&&isAdmin&&(
        <div className="modal-bg z-50" style={{position:'fixed',top:0,left:0,right:0,bottom:0,width:'100%',height:'100vh',overflowY:'auto',display:'flex',alignItems:'flex-start',justifyContent:'center',padding:'16px',boxSizing:'border-box'}}>
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 fade-up" style={{marginLeft:'auto',marginRight:'auto'}}>
            <h3 className="font-900 text-brand-900 text-xl mb-6">{modal==='add'?'➕ إضافة طالب':'✏️ تعديل الطالب'}</h3>
            <div className="space-y-4">
              <Inp label="الاسم الكامل" value={form.name} onChange={v=>F({name:v})} placeholder="الاسم" icon="👤"/>
              <Inp label="رقم الهاتف" value={form.phone} onChange={v=>F({phone:v})} placeholder="077..." icon="📱"/>
              <Inp label="البريد الإلكتروني" value={form.email} onChange={v=>F({email:v})} placeholder="email@..." icon="✉️"/>
              <div className="bg-blue-50 rounded-2xl p-4 space-y-3">
                <p className="text-xs font-800 text-blue-600 mb-1">🏅 بطاقة أفضل عمل — تظهر في الرئيسية</p>
                <Inp label="تسمية العمل" value={form.projectLabel} onChange={v=>F({projectLabel:v})} placeholder="مثال: أفضل شعار لمسه" icon="🏷️"/>
                <Inp label="اسم العمل / المشروع" value={form.bestProject} onChange={v=>F({bestProject:v})} placeholder="مثال: هوية بصرية لمقهى" icon="🎨"/>
              </div>
              <label className="flex items-center gap-3 cursor-pointer p-3 rounded-xl hover:bg-blue-50 transition">
                <input type="checkbox" checked={form.completed} onChange={e=>F({completed:e.target.checked})} className="w-5 h-5 accent-blue-600 rounded"/>
                <span className="font-700 text-brand-900">🎓 أتمّ الدورة كاملةً</span>
              </label>
              <label className="flex items-center gap-3 cursor-pointer p-3 rounded-xl hover:bg-amber-50 border border-amber-100 transition">
                <input type="checkbox" checked={!!form.showInBestWorks} onChange={e=>F({showInBestWorks:e.target.checked})} className="w-5 h-5 accent-amber-500 rounded"/>
                <span className="font-700 text-brand-900">🏅 إظهار في أفضل الأعمال</span>
              </label>
            </div>
            <div className="flex gap-3 mt-6">
              <button onClick={save} className="flex-1 py-3 rounded-xl font-800 text-white"
                style={{background:'linear-gradient(135deg,#1d4ed8,#06b6d4)'}}>حفظ</button>
              <button onClick={()=>setModal(null)} className="flex-1 py-3 rounded-xl font-700 bg-gray-100 text-gray-500 hover:bg-gray-200 transition">إلغاء</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function Grades(){
  const {students:ss,grades:gs,setGrades,isAdmin}=useContext(Ctx);
  const [ed,setEd]=useState(null); const [form,setForm]=useState({plus:0,tasks:0,identity:0,notes:''});
  const list=rankList(ss,gs);
  const vals=ss.map(s=>tot(gs[s.id]||{}));

  function save(){
    setGrades(p=>({...p,[ed.id]:{...form,plus:+form.plus,tasks:+form.tasks,identity:+form.identity}}));
    setEd(null);
  }

  return (
    <div className="fade-up space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <h2 className="text-brand-900 text-xl font-800">📊 درجات الطلاب</h2>
        <div className="flex gap-2 flex-wrap">
          <Chip label="بلص (100)" color="amber" icon="⭐"/>
          <Chip label="المهام (300)" color="blue" icon="📋"/>
          <Chip label="الهوية البصرية (100)" color="purple" icon="🎨"/>
        </div>
      </div>

      {/* Stats */}
      <div className="grid grid-cols-3 gap-4">
        {[
          {l:'أعلى درجة',v:vals.length?Math.max(...vals):'—',i:'🏆',c:'blue'},
          {l:'المتوسط',   v:vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):'—',i:'📈',c:'cyan'},
          {l:'أقل درجة', v:vals.length?Math.min(...vals):'—',i:'📉',c:'amber'},
        ].map((c,i)=>(
          <div key={i} className="card p-4 text-center">
            <div className="text-2xl mb-1">{c.i}</div>
            <div className={`font-900 text-2xl grad-text`}>{c.v}</div>
            <div className="text-gray-400 text-xs font-500 mt-0.5">{c.l}</div>
          </div>
        ))}
      </div>

      {/* Table */}
      <div className="card overflow-hidden overflow-x-auto">
        <table className="w-full text-sm">

            <tr className="hero-bg text-white">
              {['#','الطالب','⭐ بلص','📋 المهام','🎨 الهوية','الإجمالي','%',''].map((h,i)=>(
                <th key={i} className={`px-4 py-3.5 font-700 ${i<2?'text-right':'text-center'} ${isAdmin&&i===7?'':''}${!isAdmin&&i===7?'hidden':''}`}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {list.map((s,i)=>{
              const g=gs[s.id]||{}; const t=tot(g); const pct=Math.round(t/5);
              const rowBg = i===0?'bg-amber-50/60':i%2===0?'bg-white':'bg-blue-50/30';
              return (
                <tr key={s.id} className={`border-b border-blue-50 ${rowBg} hover:bg-blue-50/60 transition-colors`}>
                  <td className="px-4 py-3 text-center font-800 text-gray-300 text-sm">{i+1}</td>

                  <td className="px-4 py-3 text-center"><Chip label={`${g.plus||0}/100`} color="amber"/></td>

              <GInp label="🎨 الهوية البصرية" sub="من 100" value={form.identity} max={100} onChange={v=>setForm(p=>({...p,identity:v}))} color="purple"/>
              <div>
                <label className="text-sm font-700 text-brand-800 mb-1.5 block">📝 ملاحظات</label>
                <textarea value={form.notes} onChange={e=>setForm(p=>({...p,notes:e.target.value}))} rows={2}

                <span className="text-gray-500 text-sm">الإجمالي: </span>
                <span className="font-900 text-2xl grad-text">{+form.plus+ +form.tasks+ +form.identity}</span>

              </div>
            </div>

              <button onClick={save} className="flex-1 py-3 rounded-xl font-800 text-white" style={{background:'linear-gradient(135deg,#1d4ed8,#06b6d4)'}}>حفظ</button>
              <button onClick={()=>setEd(null)} className="flex-1 py-3 rounded-xl font-700 bg-gray-100 text-gray-500 hover:bg-gray-200 transition">إلغاء</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

            </div>
            {/* متطلبات */}
            <div className="bg-orange-50 border border-orange-100 rounded-2xl p-4 space-y-1.5">
              <div className="font-800 text-orange-700 text-sm mb-2">📋 متطلبات التسليم:</div>
              {['تقليد التصميم طبق الأصل بالفوتوشوب','مطابقة الألوان والخطوط والعناصر','حفظ الملف بصيغة PSD + PNG بدقة عالية','رفع العمل قبل انتهاء وقت المهمة'].map((r,i)=>(

              <img src={TASK_ONE_IMG} alt="مهمة التصميم" className="w-full rounded-2xl border border-orange-100 shadow-sm"
                style={{maxHeight:400,objectFit:'contain',background:'#111'}}/>
            </div>
          </div>
        </div>

                      {g!=null

                        :<span className="text-gray-300 text-xs w-28 text-center">لم يُدرج بعد</span>}

                      </button>}
                    </div>
                  );
                })}
              </div>
            </div>
          );

      </div>

      {/* Task Modal */}
      {modal&&isAdmin&&(

                      <div className="text-xs text-gray-400 mt-0.5">{o.d}</div>
                    </button>
                  ))}

              </div>
              <div className="grid grid-cols-3 gap-3">
                <Inp label="الأسبوع" value={form.week} onChange={v=>F({week:v})} type="number"/>
                <Inp label="آخر موعد" value={form.deadline} onChange={v=>F({deadline:v})} type="date"/>
                <Inp label="الدرجة القصوى" value={form.maxGrade} onChange={v=>F({maxGrade:v})} type="number"/>
              </div>
            </div>
            <div className="flex gap-3 mt-6">
              <button onClick={saveTask} className="flex-1 py-3 rounded-xl font-800 text-white" style={{background:'linear-gradient(135deg,#1d4ed8,#06b6d4)'}}>حفظ</button>
              <button onClick={()=>setModal(null)} className="flex-1 py-3 rounded-xl font-700 bg-gray-100 text-gray-500">إلغاء</button>
            </div>
          </div>
        </div>
      )}

      {/* Grade Modal */}
      {gm&&isAdmin&&(
        <div className="modal-bg z-50">
          <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-8 fade-up" style={{marginLeft:'auto',marginRight:'auto'}}>
            <h3 className="font-900 text-brand-900 text-lg mb-1">📝 إدراج درجة</h3>

        </div>
      )}
    </div>
  );
}

function Groups(){
  const {students:ss,groups,setGroups,isAdmin}=useContext(Ctx);
  const [infoM,setInfoM]=useState(null);
  const [form,setForm]=useState({name:'',project:'',grade:0});
  const [membM,setMembM]=useState(null);
  const usedIds=groups.flatMap(g=>g.members);

  function saveInfo(){
    if(!form.name.trim())return;
    if(infoM==='add') setGroups(p=>[...p,{id:Date.now(),name:form.name,project:form.project,grade:+form.grade,members:[]}]);
    else setGroups(p=>p.map(g=>g.id===infoM.id?{...g,...form,grade:+form.grade}:g));
    setInfoM(null);
  }
  function addM(gid,sid){
    setGroups(p=>p.map(g=>g.id!==gid||g.members.length>=3||g.members.includes(sid)?g:{...g,members:[...g.members,sid]}));
  }
  function remM(gid,sid){
    setGroups(p=>p.map(g=>g.id!==gid?g:{...g,members:g.members.filter(x=>x!==sid)}));
  }
  const activeG=membM?groups.find(g=>g.id===membM):null;

  return (
    <div className="fade-up space-y-5">
      <div className="flex items-center justify-between">
        <h2 className="text-brand-900 text-xl font-800">🤝 الكروبات</h2>
        {isAdmin&&<button onClick={()=>{setForm({name:`مجموعة ${String.fromCharCode(1575+groups.length)}`,project:'',grade:0});setInfoM('add');}}
          className="flex items-center gap-2 px-5 py-2.5 rounded-xl font-700 text-white text-sm"
          style={{background:'linear-gradient(135deg,#1d4ed8,#06b6d4)',boxShadow:'0 4px 14px rgba(29,78,216,.3)'}}>
          <span className="text-lg">+</span> كروب جديد
        </button>}

      {groups.length===0&&<div className="card p-16 text-center text-gray-400">لا توجد كروبات بعد.</div>}

      <div className="grid md:grid-cols-2 gap-5">
        {groups.map(g=>{
          const mems=ss.filter(s=>g.members.includes(s.id));
          return (
            <div key={g.id} className="card overflow-hidden">
              {/* Header */}
              <div className="hero-bg p-5 flex items-start justify-between">
                <div>
                  <h3 className="font-900 text-white text-lg">{g.name}</h3>
                  <p className="text-blue-200 text-sm mt-0.5">🎨 {g.project||'—'}</p>
                </div>
                <div className="text-right">
                  <div className="font-900 text-2xl text-white">{g.grade}<span className="text-xs text-blue-300 font-400">/100</span></div>
                  {isAdmin&&(
                    <div className="flex gap-1 mt-1 justify-end">
                      <button onClick={()=>{setForm({name:g.name,project:g.project,grade:g.grade});setInfoM(g);}}
                        className="w-7 h-7 rounded-lg bg-white/20 hover:bg-white/30 text-white flex items-center justify-center text-xs transition">✏️</button>
                      <button onClick={()=>confirm('حذف الكروب؟')&&setGroups(p=>p.filter(x=>x.id!==g.id))}
                        className="w-7 h-7 rounded-lg bg-red-500/30 hover:bg-red-500/50 text-white flex items-center justify-center text-xs transition">🗑️</button>
                    </div>
                  )}
                </div>
              </div>
              {/* Progress */}
              <div className="px-5 pt-3">
                <Bar pct={g.grade} h={6}/>
              </div>
              {/* Members */}
              <div className="p-5">
                <div className="flex items-center justify-between mb-3">
                  <span className="text-sm font-700 text-brand-800">الأعضاء <span className="text-gray-400 font-400">({mems.length}/3)</span></span>
                  {isAdmin&&(
                    <button onClick={()=>setMembM(g.id)}
                      className="px-3 py-1.5 rounded-lg text-xs font-700 text-white transition"
                      style={{background:'linear-gradient(135deg,#1d4ed8,#06b6d4)'}}>⚙️ إدارة الأعضاء</button>

                      </div>
                    ))}
                  </div>
                }
              </div>
            </div>
          );
        })}
      </div>

/* ── Firestore helpers ── */
function fsSet(key,val){ db.collection('cis').doc(key).set({data:val}).catch(e=>console.error('fsSet',e)); }

function useFire(key,def){
  const [val,setVal]=useState(def);
  const [loaded,setLoaded]=useState(false);
  useEffect(()=>{
    let active=true;
    // Initial load
    db.collection('cis').doc(key).get()
      .then(snap=>{ if(active){ setVal(snap.exists?snap.data().data:def); setLoaded(true); } })
      .catch(()=>{ if(active) setLoaded(true); });
    // Poll every 5 seconds for real-time sync
    const timer=setInterval(()=>{
      db.collection('cis').doc(key).get()
        .then(snap=>{ if(active&&snap.exists) setVal(snap.data().data); })
        .catch(()=>{});
    },5000);
    return ()=>{ active=false; clearInterval(timer); };
  },[key]);
  const setter=useCallback(v=>{
    setVal(prev=>{
      const next=typeof v==='function'?v(prev):v;
      fsSet(key,next);
      return next;
    });
  },[key]);
  return [val,setter,loaded];
}
